[project]
name = "mediamaster-api"
version = "0.1.0"
description = "MediaMaster backend API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pyjwt[crypto]>=2.10",
    "python-ulid>=3.0",
]

[dependency-groups]
dev = [
    "boto3>=1.35",
    "moto[dynamodb]>=5.0",
    "pytest>=8.0",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediamaster_api"]
